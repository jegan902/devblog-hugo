{{ define "main" }}
<section class="contact">
  <div class="contact-container">
    <h1 class="contact-title">LIÊN HỆ</h1>
    <p class="contact-intro">
      Bạn có câu hỏi? Liên hệ với tôi hôm nay! Hãy để tôi hỗ trợ bạn trong việc tìm kiếm câu trả lời.
    </p>

    <div class="contact-grid">
      <div class="contact-info">
        <h2 class="info-title">THÔNG TIN LIÊN HỆ</h2>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <p>Email: <a href="mailto:h.com.vha@gmail.com">h.com.vha@gmail.com</a></p>
        </div>
        <div class="info-item">
          <i class="fas fa-phone"></i>
          <p>Điện thoại: <a href="tel:+84365885628">+84 365 885 628</a></p>
        </div>
        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <p>Vị trí: Hồ Chí Minh, Việt Nam</p>
        </div>
      </div>

      <div class="contact-form">
        <h2 class="form-title">GỬI TIN NHẮN</h2>
        <form id="contactForm">
          <input type="text" placeholder="Họ và tên *" required>
          <input type="email" placeholder="Email *" required>
          <textarea placeholder="Nội dung *" rows="5" required></textarea>
          <button type="submit" class="btn primary">GỬI TIN NHẮN</button>
        </form>
      </div>
    </div>
  </div>
</section>

<style>
/* ===== CONTACT SECTION ===== */
.contact {
  /* background: linear-gradient(135deg, #000000 0%, #111111 50%, #1a1a1a 100%); */
  color: #fff;
  padding: 60px 5%;
  min-height: 100vh;
  display: flex;
  align-items: center;
}
.contact-container {
  max-width: 1000px;
  margin: auto;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.8s ease forwards;
}
@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.contact-title {
  font-size: 2.5rem;
  background: linear-gradient(135deg, #d8ff4d 0%, #a8e02d 50%, #8fd12d 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  text-shadow: 0 0 10px rgba(216, 255, 77, 0.2);
}
.contact-intro {
  font-size: 1.1rem;
  color: #e0e0e0;
  text-align: center;
  margin-bottom: 40px;
  line-height: 1.7;
  opacity: 0;
  animation: fadeIn 0.6s ease 0.2s forwards;
}
@keyframes fadeIn {
  to { opacity: 1; }
}
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  opacity: 0;
  animation: fadeIn 0.6s ease 0.4s forwards;
}
@media (max-width: 768px) {
  .contact-grid {
    grid-template-columns: 1fr;
    gap: 30px;
  }
}

/* ===== CONTACT INFO ===== */
.contact-info {
  /* background: rgba(26, 26, 46, 0.2); */
  padding: 30px;
  border-radius: 15px;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(216, 255, 77, 0.05);
  transition: all 0.3s ease;
}
.contact-info:hover {
  box-shadow: 0 5px 15px rgba(216, 255, 77, 0.1);
  border-color: rgba(216, 255, 77, 0.2);
}
.info-title {
  color: #d8ff4d;
  font-size: 1.5rem;
  margin-bottom: 20px;
  text-align: center;
  font-weight: 600;
}
.info-item {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
  padding: 10px;
  border-radius: 8px;
  transition: background 0.3s ease;
}
.info-item:hover {
  background: rgba(216, 255, 77, 0.05);
}
.info-item i {
  color: #d8ff4d;
  font-size: 1.2rem;
  width: 20px;
}
.info-item p {
  margin: 0;
  color: #b8b8b8;
  font-size: 1rem;
}
.info-item a {
  color: #d8ff4d;
  text-decoration: none;
  transition: color 0.3s ease;
}
.info-item a:hover {
  color: #a8e02d;
  text-decoration: underline;
}

/* ===== CONTACT FORM ===== */
.contact-form {
  /* background: rgba(26, 26, 46, 0.2); */
  padding: 30px;
  border-radius: 15px;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(216, 255, 77, 0.05);
  transition: all 0.3s ease;
}
.contact-form:hover {
  box-shadow: 0 5px 15px rgba(216, 255, 77, 0.1);
  border-color: rgba(216, 255, 77, 0.2);
}
.form-title {
  color: #d8ff4d;
  font-size: 1.5rem;
  margin-bottom: 20px;
  text-align: center;
  font-weight: 600;
}
.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 12px 15px;
  margin-bottom: 15px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(216, 255, 77, 0.2);
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  transition: all 0.3s ease;
  box-sizing: border-box;
}
.contact-form input::placeholder,
.contact-form textarea::placeholder {
  color: #b8b8b8;
}
.contact-form input:focus,
.contact-form textarea:focus {
  outline: none;
  border-color: #d8ff4d;
  box-shadow: 0 0 10px rgba(216, 255, 77, 0.3);
  background: rgba(255, 255, 255, 0.1);
}
.contact-form textarea {
  resize: vertical;
  min-height: 120px;
}
.btn {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 1rem;
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.3px;
  border: none;
  cursor: pointer;
}
.btn.primary {
  background: linear-gradient(135deg, #d8ff4d 0%, #a8e02d 50%, #8fd12d 100%);
  color: #000;
  box-shadow: 0 3px 10px rgba(216, 255, 77, 0.3);
}
.btn.primary:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 5px 15px rgba(216, 255, 77, 0.4);
}
.btn.primary:active {
  transform: scale(0.98);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .contact {
    padding: 40px 3%;
  }
  .contact-title {
    font-size: 2.2rem;
  }
  .contact-intro {
    font-size: 1rem;
  }
  .contact-info,
  .contact-form {
    padding: 20px;
  }
  .info-item {
    gap: 10px;
    margin-bottom: 15px;
  }
  .info-item i {
    font-size: 1.1rem;
  }
}

@media (max-width: 480px) {
  .contact {
    padding: 30px 2%;
  }
  .contact-title {
    font-size: 2rem;
  }
  .contact-grid {
    gap: 20px;
  }
  .contact-info,
  .contact-form {
    padding: 15px;
  }
  .info-title,
  .form-title {
    font-size: 1.3rem;
  }
  .btn {
    padding: 10px;
    font-size: 0.95rem;
  }
}
</style>

<script>
// JS cho form submission (simulate gửi mail, thay bằng backend thực tế nếu cần)
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('contactForm');
  const observerOptions = {
    threshold: 0.1,
    rootMargin: '0px 0px -50px 0px'
  };

  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
      }
    });
  }, observerOptions);

  observer.observe(document.querySelector('.contact-container'));

  // Form handling (prevent default, show alert - thay bằng AJAX nếu cần)
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(form);
    const name = form.querySelector('input[type="text"]').value;
    alert(`Cảm ơn ${name}! Tin nhắn của bạn đã được gửi. Tôi sẽ liên hệ sớm.`);
    form.reset(); // Reset form
  });

  // Ripple effect cho button (tương tự previous)
  const btn = document.querySelector('.btn');
  btn.addEventListener('mouseenter', function(e) {
    this.style.transform = 'translateY(-2px) scale(1.03)';
    // Ripple
    const ripple = document.createElement('span');
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;
    ripple.style.cssText = `
      position: absolute;
      width: ${size}px;
      height: ${size}px;
      left: ${x}px;
      top: ${y}px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 0.5s linear;
      pointer-events: none;
    `;
    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 500);
  });
  btn.addEventListener('mouseleave', function() {
    this.style.transform = 'translateY(0) scale(1)';
  });
});

// CSS cho ripple (inline)
const rippleStyle = document.createElement('style');
rippleStyle.textContent = `
  @keyframes ripple {
    to {
      transform: scale(3);
      opacity: 0;
    }
  }
`;
document.head.appendChild(rippleStyle);
</script>
{{ end }}
